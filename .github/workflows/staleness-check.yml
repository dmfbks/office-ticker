name: Staleness check

# Runs 3x/hour. Reads the `_updated_at` timestamps on crypto.json + indices.json
# from the feed branch. If either is stale beyond its threshold,
# dispatches refresh-crypto.yml and refresh-indices.yml directly.
#
# Note: a previous version nudged via a commit to main, but pushes made with the
# built-in GITHUB_TOKEN never trigger other workflows, so it revived nothing.
# workflow_dispatch is the documented exception.
#
# Why this exists: GitHub Actions free-tier scheduled workflows are silently
# skipped during high-load windows on github.com. The 2-min crypto cron and
# 10-min indices cron can both go quiet for hours. This watchdog gives us a
# self-healing pulse.

on:
  schedule:
    - cron: '7,27,47 * * * *'   # 3x/hour, offset from the 2-min/10-min jobs (this cron is throttled too)
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: staleness-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feed (has the data files)
        uses: actions/checkout@v4
        with:
          ref: feed

      - name: Inspect staleness
        id: inspect
        run: |
          python3 <<'PY'
          import json, os
          from datetime import datetime, timezone

          THRESHOLDS = {
              'crypto.json':  15,   # 2-min cron — 15 min ≈ 7 missed ticks
              'indices.json': 25,   # 10-min cron — 25 min ≈ 2.5 missed ticks
          }

          now = datetime.now(timezone.utc)
          needs_nudge = False
          report = []
          for filename, threshold_min in THRESHOLDS.items():
              try:
                  with open(filename) as f:
                      data = json.load(f)
              except Exception as e:
                  report.append(f"{filename}: READ FAILED ({e}) — treating as stale")
                  needs_nudge = True
                  continue
              updated = data.get('_updated_at')
              if not updated:
                  report.append(f"{filename}: no _updated_at field — treating as stale")
                  needs_nudge = True
                  continue
              ts = datetime.fromisoformat(updated.replace('Z', '+00:00'))
              age_min = (now - ts).total_seconds() / 60
              if age_min > threshold_min:
                  report.append(f"{filename} STALE: {age_min:.1f}min old > {threshold_min}min threshold")
                  needs_nudge = True
              else:
                  report.append(f"{filename} fresh: {age_min:.1f}min old")
          print("\n".join(report))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"needs_nudge={'true' if needs_nudge else 'false'}\n")
          PY

      - name: Dispatch refresh workflows
        if: steps.inspect.outputs.needs_nudge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run refresh-crypto.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run refresh-indices.yml --repo "$GITHUB_REPOSITORY" --ref main
